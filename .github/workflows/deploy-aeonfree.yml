name: Deploy Gearora to AeonFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gearora-aeonfree-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and package Gearora
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, mbstring, openssl, pdo_mysql, pdo_sqlite, simplexml, tokenizer, xml, xmlreader, xmlwriter, zip
          coverage: none
          tools: composer:v2

      # Package discovery boots Laravel. Build as local so production readiness
      # validation remains active for real production, never for CI packaging.
      - name: Prepare isolated CI environment
        shell: bash
        run: |
          set -euo pipefail

          app_key="base64:$(php -r 'echo base64_encode(random_bytes(32));')"

          cat > .env <<EOF
          APP_NAME=GEARORA
          APP_ENV=local
          APP_KEY=${app_key}
          APP_DEBUG=true
          APP_URL=http://localhost
          APP_TIMEZONE=Asia/Jakarta
          APP_LOCALE=id
          APP_FALLBACK_LOCALE=en
          LOG_CHANNEL=stack
          LOG_LEVEL=debug
          DB_CONNECTION=sqlite
          DB_DATABASE=:memory:
          SESSION_DRIVER=array
          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          FILESYSTEM_DISK=local
          MIDTRANS_FAKE=true
          GEARORA_PAYMENT_GATEWAY_ENABLED=false
          EOF

      - name: Validate Composer lock file
        run: composer validate --no-check-publish

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare private and public deployment packages
        shell: bash
        run: |
          set -euo pipefail

          rm -rf deploy
          mkdir -p deploy/app deploy/public

          # Source, vendor, migrations, and private runtime state live outside htdocs.
          rsync -a ./ deploy/app/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.docs/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='deploy/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/' \
            --exclude='public/' \
            --exclude='database/*.sqlite' \
            --exclude='database/*.sqlite-*'

          # Laravel needs its own public directory for public_path() and Vite.
          # htdocs gets a separate, web-served copy. Never ship Vite dev-server state.
          rsync -a public/ deploy/app/public/ \
            --exclude='hot' \
            --exclude='storage/'
          rsync -a public/ deploy/public/ \
            --exclude='hot' \
            --exclude='storage/'

          # Repository product and guide media are intentionally private. Laravel
          # serves allowed image formats through /media/{path}, not public/storage.
          mkdir -p deploy/app/storage/app/public
          rsync -a storage/app/public/ \
            deploy/app/storage/app/public/

          # htdocs must never let a stale default index.html outrank index.php.
          # Applied to the htdocs copy only; app source .htaccess stays unchanged.
          { printf 'DirectoryIndex index.php index.html\n\n'; cat deploy/public/.htaccess; } \
            >> deploy/public/.htaccess.tmp \
            && mv deploy/public/.htaccess.tmp deploy/public/.htaccess

          # Public entry point boots sibling private application directory.
          cat > deploy/public/index.php <<'PHP'
          <?php

          use Illuminate\Foundation\Application;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          $maintenance = __DIR__.'/../gearora-app/storage/framework/maintenance.php';

          if (file_exists($maintenance)) {
              require $maintenance;
          }

          require __DIR__.'/../gearora-app/vendor/autoload.php';

          /** @var Application $app */
          $app = require_once __DIR__.'/../gearora-app/bootstrap/app.php';

          $app->handleRequest(Request::capture());
          PHP

          # Empty runtime paths exist without local logs, sessions, or caches.
          for dir in \
            storage/app/private \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/views \
            storage/logs
          do
            mkdir -p "deploy/app/$dir"
            printf '*\n!.gitignore\n' > "deploy/app/$dir/.gitignore"
          done

          test -f deploy/app/vendor/autoload.php
          test -f deploy/app/public/build/manifest.json
          test -f deploy/public/build/manifest.json
          test -f deploy/public/index.php
          test -f deploy/public/.htaccess
          test -f deploy/app/storage/app/public/products/backpack-carrier/1-backpack-carrier-1.jpg
          test "$(find deploy/app/storage/app/public -type f | wc -l)" -ge 100
          test ! -e deploy/public/.env
          test ! -e deploy/public/vendor
          test ! -e deploy/public/storage
          test ! -e deploy/public/hot
          test ! -e deploy/app/public/hot
          ! find deploy/public -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .
          ! find deploy/public -type f -name '*.php' ! -path 'deploy/public/index.php' -print -quit | grep -q .
          ! find deploy/public -iname '*proof*' -print -quit | grep -q .
          grep -q '^DirectoryIndex index.php index.html' deploy/public/.htaccess
          grep -q 'gearora-app/vendor/autoload.php' deploy/public/index.php
          grep -q 'gearora-app/bootstrap/app.php' deploy/public/index.php
          grep -q 'gearora-app/storage/framework/maintenance.php' deploy/public/index.php
          for dir in \
            deploy/app/storage/app/private \
            deploy/app/storage/app/public \
            deploy/app/storage/framework/cache/data \
            deploy/app/storage/framework/sessions \
            deploy/app/storage/framework/views \
            deploy/app/storage/logs
          do
            test -d "$dir"
          done
          echo "Packaged media files: $(find deploy/app/storage/app/public -type f | wc -l)"
          echo "Packaged public files: $(find deploy/public -type f | wc -l)"

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: gearora-aeonfree-${{ github.sha }}
          path: deploy/
          if-no-files-found: error
          retention-days: 7

      # Keep this gate false until manual first-deployment checks are complete.
      - name: Deploy private Laravel application to AeonFree
        if: ${{ vars.AEONFREE_DEPLOY_ENABLED == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: deploy/app/
          server-dir: /gearora-app/
          dangerous-clean-slate: false
          log-level: standard

      - name: Deploy public website to AeonFree
        if: ${{ vars.AEONFREE_DEPLOY_ENABLED == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: deploy/public/
          server-dir: /htdocs/
          dangerous-clean-slate: false
          log-level: standard

      - name: Deployment status
        if: always()
        shell: bash
        run: |
          if [[ "${{ vars.AEONFREE_DEPLOY_ENABLED }}" == "true" ]]; then
            echo "FTP deployment was enabled. Check the two FTP steps above."
          else
            echo "Build and artifact upload completed. FTP remains disabled until AEONFREE_DEPLOY_ENABLED is true."
          fi
